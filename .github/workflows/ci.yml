name: BioRNAlytics CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds frontend and backend and runs the tests.
  build-and-test:
    runs-on: ubuntu-latest

    # The tests start the full Spring application and therefore need
    # MongoDB and RabbitMQ (configuration: src/test/resources/application.properties).
    # MongoDB is started in a step below so its logs are visible if it fails.
    services:
      rabbitmq:
        image: rabbitmq:4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" > /dev/null 2>&1; then
              echo "MongoDB is up"
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not start. Container logs:"
          docker logs mongo
          exit 1

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Build application and run unit tests
        run: mvn --batch-mode --no-transfer-progress -DskipUTs=false verify

  # Checks that the Docker image (used by reviewers) can be built.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
