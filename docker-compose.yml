# Start the complete BioRNAlytics stack:
#   docker compose up --build
#
# Then open:
#   App ............ http://localhost:8080
#   Emails ......... http://localhost:8025   (Mailpit catches all emails)
#   RabbitMQ-Admin . http://localhost:15672  (guest / guest)

services:

  app:
    build: .
    image: biornalytics:latest
    container_name: biornalytics-app
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # --- MongoDB ---
      # Default: the empty MongoDB from this compose project.
      # Set MONGODB_URI in .env to use an existing database instead
      # (e.g. MongoDB Atlas).
      # Spring Boot 4 reads spring.mongodb.*, older versions spring.data.mongodb.*
      SPRING_MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/biornalytics}
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/biornalytics}

      # --- RabbitMQ (job queue for the R analyses) ---
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      # --- Email (verification, password reset) goes to Mailpit instead of real SMTP ---
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025

      # --- Upload size for count matrices ---
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 200MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 200MB

      # --- JWT-Login (SecurityConstant.java) ---
      SECURITY_AUTHLOGINURL: /api/authenticate
      SECURITY_JWTSECRET: ${JWT_SECRET:-biornalytics-local-development-key-replace-it-in-env-for-any-real-deployment}
      SECURITY_TOKENPREFIX: "Bearer "
      SECURITY_TOKENHEADER: Authorization
      SECURITY_TOKENTYPE: JWT
      SECURITY_TOKENISSUER: secure-api
      SECURITY_TOKENAUDIENCE: secure-app

      # --- Public app URL used in email links (verification, password reset) ---
      APP_BASEURL: ${APP_BASE_URL:-http://localhost:8080}

      # --- R analysis (already set in the Dockerfile, listed here for clarity) ---
      APP_R_EXECUTABLE: /usr/bin/Rscript
      APP_R_SCRIPTPATH: /app/r/deg.R
      APP_STORAGE_BASEDIR: /data
    volumes:
      # Default: a Docker volume. Set ANALYSIS_DATA_DIR in .env to mount a
      # folder from the host instead (e.g. C:/bioinformatics/data) so that
      # earlier analyses with their plots and CSVs are available.
      - ${ANALYSIS_DATA_DIR:-analysis-data}:/data
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: biornalytics-mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: biornalytics-rabbitmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: biornalytics-mailpit
    ports:
      - "8025:8025"

volumes:
  mongo-data:
  analysis-data:
