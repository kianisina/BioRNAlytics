# Konfiguration nur fuer automatische Tests (mvn verify, GitHub CI).
# Diese Datei hat beim Testen Vorrang vor src/main/resources/application.properties,
# damit Tests nie die echte Datenbank benutzen (InitialiseDatabase loescht Benutzer!).
# Erwartet MongoDB und RabbitMQ auf localhost: in der CI als Service-Container,
# lokal z. B. mit "docker compose up -d mongo rabbitmq".

spring.application.name=web

spring.mongodb.uri=mongodb://localhost:27017/biornalytics-test
spring.data.mongodb.uri=mongodb://localhost:27017/biornalytics-test

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Beim Testen werden keine E-Mails verschickt
spring.mail.host=localhost
spring.mail.port=1025

security.auth-login-url=/api/authenticate
security.jwt-secret=nur-fuer-tests-ein-schluessel-mit-mindestens-vierundsechzig-zeichen-fuer-hs512
security.token-header=Authorization
security.token-prefix=Bearer
security.token-type=JWT
security.token-issuer=secure-api
security.token-audience=secure-app

app.base-url=http://localhost:8080
app.storage.base-dir=${java.io.tmpdir}/biornalytics-test
app.r.executable=Rscript
app.r.script-path=src/main/r/deg.R
