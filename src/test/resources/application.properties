# Configuration for automated tests only (mvn verify, GitHub CI).
# During tests this file takes precedence over src/main/resources/application.properties,
# so tests never touch the real database (InitialiseDatabase deletes users!).
# Expects MongoDB and RabbitMQ on localhost: service containers in CI,
# locally e.g. via "docker compose up -d mongo rabbitmq".

spring.application.name=web

spring.mongodb.uri=mongodb://localhost:27017/biornalytics-test
spring.data.mongodb.uri=mongodb://localhost:27017/biornalytics-test

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# No emails are sent during tests
spring.mail.host=localhost
spring.mail.port=1025

security.auth-login-url=/api/authenticate
security.jwt-secret=test-only-secret-key-with-at-least-sixty-four-characters-for-hs512-signing
security.token-header=Authorization
security.token-prefix=Bearer
security.token-type=JWT
security.token-issuer=secure-api
security.token-audience=secure-app

app.base-url=http://localhost:8080
app.storage.base-dir=${java.io.tmpdir}/biornalytics-test
app.r.executable=Rscript
app.r.script-path=src/main/r/deg.R
